<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cali</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1c1c1c;
      --muted: #6b6b6b;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #f0f0f0;
        --muted: #9a9a9a;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    main {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Cali</h1>
    <p>Este sitio está publicado con GitHub Pages. Edita <code>index.html</code> para empezar.</p>
    <a href="https://github.com/mayckths/cali">Ver el repositorio en GitHub</a>
  </main>
</body>
</html>
